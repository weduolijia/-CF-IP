name: Update APAC Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "18 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ENABLE_CN_API_LATENCY: "1"
      CN_TCPING_WORKERS: "50"
      CN_TCPING_TIMEOUT: "8"
      CN_TCPING_MAX_QPS: "40"
      # MO sources are currently dry; tolerate its temporary absence so the
      # feed keeps updating. Remove once MO candidates recover.
      TOLERATED_MISSING_COUNTRIES: "MO"
      # Domestic latency: single API for now. jkapi zz_tcping was evaluated
      # 2026-10-03 as LATENCY_API_B but rejected: its single Ningbo Telecom
      # node fails ~75% of candidate IPs and tarpits under concurrency (a
      # two-mode run hung 50+ min in the latency stage and had to be
      # cancelled). See antping.com (JWT+WS, multi-ISP) as a future stronger
      # backup candidate.
      LATENCY_GROUP_MODE: "single"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Test updater safeguards
        run: python -m unittest discover -s tests -v

      - name: Generate feed
        run: python fetch_apac.py

      - name: Commit updated feed
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: "Update APAC proxy feed"
          file_pattern: all.txt raw.all top10.txt top10.json

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changes_detected == 'true'
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/weduolijia/-CF-IP@main/raw.all"
          curl -fsS "https://purge.jsdelivr.net/gh/weduolijia/-CF-IP@main/all.txt"
          curl -fsS "https://purge.jsdelivr.net/gh/weduolijia/-CF-IP@main/top10.txt"
          curl -fsS "https://purge.jsdelivr.net/gh/weduolijia/-CF-IP@main/top10.json"
